<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F5EF" />
    <title>IdeaDump offline</title>
    <style>
      :root {
        color: #1f1f1f;
        background: #f8f5ef;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 32px, 440px);
        border: 1px solid #d8d0c2;
        border-radius: 16px;
        background: #fffaf2;
        padding: 32px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #61594e;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IdeaDump is offline</h1>
      <p>Reconnect to the internet and refresh the app to continue.</p>
    </main>
  </body>
</html>
