name: nightly tests

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'test-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-role-key' }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load current schema and seed
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/schema.current.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/seed.sql

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full QA suite
        run: npm run qa

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-artifacts
          path: |
            qa-report/
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Open or update nightly QA issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nightly-qa-failure -->';
            const summary = fs.existsSync('qa-report/summary.md')
              ? fs.readFileSync('qa-report/summary.md', 'utf8')
              : 'QA did not produce a summary. Check the workflow logs.';
            const title = 'Nightly regression QA failed';
            const body = [
              marker,
              'Nightly regression checks failed.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              summary,
            ].join('\n');
            const { owner, repo } = context.repo;
            for (const label of [
              { name: 'qa', color: '5319e7', description: 'Quality automation' },
              { name: 'regression', color: 'd73a4a', description: 'Regression testing' },
            ]) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'qa,regression',
              per_page: 20,
            });
            const existing = issues.data.find((issue) => issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated issue #${existing.number}`);
              return;
            }
            const issue = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['qa', 'regression'],
            });
            core.info(`Created issue #${issue.data.number}`);

      - name: Close resolved nightly QA issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nightly-qa-failure -->';
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'qa,regression',
              per_page: 20,
            });
            const existing = issues.data.find((issue) => issue.body?.includes(marker));
            if (!existing) {
              core.info('No open nightly QA issue to close.');
              return;
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: existing.number,
              body: `Nightly regression QA passed again in ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}. Closing this failure issue.`,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: existing.number,
              state: 'closed',
            });
            core.info(`Closed issue #${existing.number}`);
