name: nightly tests

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'test-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-role-key' }}
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load current schema and seed
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/schema.current.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/db/seed.sql

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full QA suite
        run: npm run qa

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-qa-artifacts
          path: |
            qa-report/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  autofix:
    needs: regression
    if: ${{ always() && needs.regression.result == 'failure' && github.ref_name != 'main' && github.ref_name != 'master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QA_BRANCH_NAME: ${{ github.ref_name }}
      QA_IS_FORK_PR: false
      QA_AGENT_COMMAND: ${{ vars.QA_AGENT_COMMAND }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download QA report
        uses: actions/download-artifact@v4
        with:
          name: nightly-qa-artifacts
          path: .

      - name: Check same-branch autofix guard
        id: guard
        env:
          GITHUB_REF_NAME: ${{ env.QA_BRANCH_NAME }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          QA_IS_FORK_PR: ${{ env.QA_IS_FORK_PR }}
          QA_AGENT_COMMAND: ${{ env.QA_AGENT_COMMAND }}
        run: node scripts/qa-autofix-guard.mjs

      - name: Print QA fix context
        run: npm run qa:fix-context
        continue-on-error: true

      - name: Run configured QA fixing agent
        if: ${{ steps.guard.outputs.allowed == 'true' }}
        run: $QA_AGENT_COMMAND

      - name: Rerun failed command
        if: ${{ steps.guard.outputs.allowed == 'true' }}
        shell: bash
        run: |
          FAILED_COMMAND="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('qa-report/report.json','utf8')); process.stdout.write(r.failingCommand || '');")"
          if [ -n "$FAILED_COMMAND" ]; then
            eval "$FAILED_COMMAND"
          fi

      - name: Rerun PR QA suite
        if: ${{ steps.guard.outputs.allowed == 'true' }}
        run: npm run test:ci

      - name: Commit verified autofix
        if: ${{ steps.guard.outputs.allowed == 'true' }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No autofix changes to commit."
            exit 0
          fi
          git config user.name "qa-autofix-agent"
          git config user.email "qa-autofix-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix: apply automated qa fix"
          git push origin HEAD:"$QA_BRANCH_NAME"
