name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect project changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      finance_ocr: ${{ steps.filter.outputs.finance_ocr }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Pushes compare with the previous push; PRs compare with their base.
          base: ${{ github.ref }}
          filters: |
            web:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'public/**'
              - 'scripts/**'
              - 'service-worker/**'
              - 'shared/**'
              - 'tests/**'
              - 'supabase/**'
              - '*.{ts,tsx,js,mjs,cjs,mts,cts}'
              - 'tsconfig*.json'
              - 'package.json'
              - 'package-lock.json'
              - '.eslintrc*'
              - '.eslintignore'
              - '.npmrc'
              - '.nvmrc'
              - '.env.example'
              - '.github/workflows/validate.yml'
            finance_ocr:
              - 'services/finance-ocr/**'
              # The worker and its tests import these shared application modules.
              - 'lib/finance/**'
              - 'lib/types.ts'
              - 'shared/**'
              - 'supabase/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - '.npmrc'
              - '.nvmrc'
              - 'render.yaml'
              - '.github/workflows/validate.yml'
            android:
              - 'android/**'
              - '.github/workflows/validate.yml'

  web:
    name: Web application
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_FINANCE_OCR_URL: http://localhost:8080
      FINANCE_QUEUE_WAKE_SECRET: ci-finance-queue-wake-secret-00000000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run application tests
        run: npm test

      - name: Build application
        run: npm run build

  finance_ocr:
    name: Finance OCR service
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.finance_ocr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/finance-ocr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: services/finance-ocr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build service
        run: npm run build

  android:
    name: Android companion
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # Google no longer distributes the legacy tools package.
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ideadump-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
