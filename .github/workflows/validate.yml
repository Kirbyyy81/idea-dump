name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.paths.outputs.web }}
      finance_ocr: ${{ steps.paths.outputs.finance_ocr }}
      android: ${{ steps.paths.outputs.android }}
    steps:
      - name: Check out repository for push comparisons
        if: github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Detect affected applications
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Pushes compare with the previous push; PRs use the complete PR diff.
          # A new branch is compared with the default branch's merge base.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            web:
              - '.github/workflows/validate.yml'
              - '.gitattributes'
              - '.nvmrc'
              - '.npmrc'
              - '.env.example'
              - '.eslintrc*'
              - 'eslint.config.*'
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - 'shared/**'
              - 'public/**'
              - 'service-worker/**'
              - 'scripts/**'
              - 'supabase/**'
              - 'tests/**'
              - 'middleware.ts'
              - 'next-env.d.ts'
              - 'next.config.*'
              - 'package.json'
              - 'package-lock.json'
              - 'playwright.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
              - 'tsconfig*.json'
              - 'vitest.config.*'
            finance_ocr:
              - '.github/workflows/validate.yml'
              - '.gitattributes'
              - '.nvmrc'
              - '.npmrc'
              - 'services/finance-ocr/**'
              - 'render.yaml'
              - 'lib/finance/ocr/**'
              - 'lib/finance/core/constants.ts'
              - 'lib/finance/core/ruleMatching.ts'
              - 'lib/finance/core/values.ts'
              - 'lib/finance/dashboard.ts'
              - 'lib/types.ts'
              - 'shared/date.ts'
            android:
              - '.github/workflows/validate.yml'
              - '.gitattributes'
              - 'android/**'

  web:
    name: Web application
    needs: changes
    # Validate conservatively if change detection fails instead of silently skipping checks.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      NEXT_PUBLIC_FINANCE_OCR_URL: http://localhost:8080
      FINANCE_QUEUE_WAKE_SECRET: ci-finance-queue-wake-secret-00000000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Run application tests
        run: npm test

      - name: Build application
        run: npm run build

  finance_ocr:
    name: Finance OCR service
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.finance_ocr == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/finance-ocr
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: services/finance-ocr/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build service
        run: npm run build

  android:
    name: Android companion
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # Google no longer distributes the legacy tools package.
          packages: 'platform-tools platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ideadump-companion-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
